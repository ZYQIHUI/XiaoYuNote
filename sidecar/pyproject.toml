[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoyu-sidecar"
version = "0.1.0"
description = "XiaoYu 知识工作站侧车 — FastAPI 服务（复用 kb RAG 引擎）"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "numpy>=1.24",
    "click>=8.1",
    "python-docx>=0.8",
    "pymupdf>=1.23",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pandas>=2.0",
    "tqdm>=4.65",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["kb", "kb.QA", "kb.QA.parsers", "kb.Transformer", "kb.Menmory", "sidecar"]
package-dir = { "kb" = "kb", "sidecar" = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
